services:
  postgres:
    image: postgres:18
    container_name: my_postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  audioPostgres:
    image: postgres:18
    container_name: my_audio_postgres
    environment:
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audio
    ports:
      - "5434:5432"
    volumes:
      - audio_postgres_data:/var/lib/postgresql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: always
    container_name: my_azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: >
      azurite --loose
      --location /data
      --blobHost 0.0.0.0 --blobPort 10000
      --queueHost 0.0.0.0 --queuePort 10001
      --tableHost 0.0.0.0 --tablePort 10002
    volumes:
      - azurite_data:/data
    
volumes:
  postgres_data:
  audio_postgres_data:
  azurite_data: