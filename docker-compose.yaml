services:
  postgres:
    image: postgres:18
    container_name: my_postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  audioPostgres:
    image: postgres:18
    container_name: my_audio_postgres
    environment:
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: audio
    ports:
      - "5434:5432"
    volumes:
      - audio_postgres_data:/var/lib/postgresql
    
volumes:
  postgres_data:
  audio_postgres_data: